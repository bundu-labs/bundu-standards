# Dependabot opens its PRs against main (trunk-based, AGENTS.md, Branching).
# Version updates wait 7 days
# after a release (cooldown), since a just-published package is the likeliest
# to be malicious or broken; the cooldown does not delay security updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust

  # The standards server is its own package, with its own lockfile.
  - package-ecosystem: cargo
    directory: /workers/standards-api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
