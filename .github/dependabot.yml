# Dependabot opens its PRs against staging: changes go to staging and are
# released to main, never merged straight into main (AGENTS.md, Branching).
# Security updates follow the same target-branch. Version updates wait 7 days
# after a release (cooldown), since a just-published package is the likeliest
# to be malicious or broken; the cooldown does not delay security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /workers/standards
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    labels:
      - dependencies
      - javascript

  - package-ecosystem: cargo
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
