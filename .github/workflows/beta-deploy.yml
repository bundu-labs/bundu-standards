name: beta-deploy

# The live beta (nyuchi/.github#80): every push to `staging` deploys to the
# Fly app `bundu-vocab-beta` (fly.beta.toml), served at
# https://bundu-vocab-beta.fly.dev. Production (`bundu-vocab`,
# vocab.bundu.org) is never touched here: the app is named on the command line as well as in the
# config, and production deploys are not made from this workflow.
#
# OWNER SETUP (one-time), until which this workflow skips cleanly:
#   fly apps create bundu-vocab-beta
#   (no app secrets are needed)
#   fly tokens create deploy -a bundu-vocab-beta
#     -> repository secret FLY_API_TOKEN

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the beta (bundu-vocab-beta)
    runs-on: ubuntu-latest
    steps:
      - name: Check for the deploy credential
        id: cred
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            msg="FLY_API_TOKEN is not set, so the beta was not deployed."
            msg="$msg Create bundu-vocab-beta and its deploy token (see the top of beta-deploy.yml)."
            echo "::warning title=Beta not deployed::$msg"
          fi

      - uses: actions/checkout@v7
        if: steps.cred.outputs.present == 'true'

      - name: Install flyctl
        if: steps.cred.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy to bundu-vocab-beta
        if: steps.cred.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.beta.toml --app bundu-vocab-beta
