name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

  # The published URIs are a permanent contract. This catches the failure
  # mode that matters most: a term that stops resolving, or one whose
  # definition silently changes shape.
  contract:
    runs-on: ubuntu-latest
    name: Vocabulary Contract
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Start server
        run: |
          LISTEN_ADDR=127.0.0.1:8080 ./target/release/bundu-vocab &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Every term resolves in both representations
        run: |
          set -euo pipefail
          TERMS=$(curl -sf http://127.0.0.1:8080/context.jsonld \
            | python3 -c "import json,sys; print(' '.join(k for k in json.load(sys.stdin)['@context'] if k not in ('schema','bundu')))")
          echo "checking: $TERMS"
          # Valid JSON-LD that names the term, with a definition, a
          # rationale and a W3C vocabulary status.
          CHECK_JSONLD='
          import json, os, sys
          d = json.load(sys.stdin)
          t = os.environ["T"]
          assert d["@id"] == "bundu:" + t, d["@id"]
          assert d["vs:term_status"] in ("stable", "testing")
          assert d["rdfs:comment"] and d["bundu:rationale"]
          '
          CHECK_JSONLD=$(printf '%s' "$CHECK_JSONLD" | sed 's/^ *//')
          for t in $TERMS; do
            curl -sf -H 'Accept: application/ld+json' "http://127.0.0.1:8080/$t" \
              | T="$t" python3 -c "$CHECK_JSONLD" \
              || { echo "::error::$t does not resolve as valid JSON-LD"; exit 1; }
            page=$(curl -sf -H 'Accept: text/html' "http://127.0.0.1:8080/$t") \
              || { echo "::error::$t does not resolve as HTML"; exit 1; }
            case "$page" in *"<code class=\"term\">$t</code>"*) ;; \
              *) echo "::error::$t HTML page does not render the term"; exit 1;; esac
          done

      - name: Content negotiation and 404 behaviour
        run: |
          set -euo pipefail
          ct=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/Family)
          [ "${ct%%;*}" = "application/ld+json" ] \
            || { echo "::error::default representation must be JSON-LD, got $ct"; exit 1; }

          ct=$(curl -s -o /dev/null -w '%{content_type}' -H 'Accept: text/html' http://127.0.0.1:8080/Family)
          case "$ct" in text/html*) ;; *) echo "::error::HTML not served, got $ct"; exit 1;; esac

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/NotATerm)
          [ "$code" = "404" ] || { echo "::error::unknown term returned $code"; exit 1; }

  # The register of adopted standards: one source (register/register.yaml), the
  # generated files must match it, and the tool's own tests must pass.
  register:
    runs-on: ubuntu-latest
    name: Standards register
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Register is linted and its generated files are current
        run: python3 register/tools/register.py check

      - name: Register tool tests
        run: python3 -m unittest discover register/tools

  comment:
    needs: [test, contract, register]
    # Push runs (main, staging) have no pull request to comment on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Status Comment
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;

            let deployInfo = '';
            if (baseBranch === 'main') {
              deployInfo = `
            ### 🚀 Deployment
            When merged, this deploys to **production**:
            - **URL:** https://vocab.bundu.org
            - **Fly app:** bundu-vocab (jnb)

            ⚠️ Term URIs are a permanent contract. A term that has been \
            published and embedded in someone's data must never change meaning or \
            stop resolving.`;
            }

            const comment = `## ✅ CI Checks Passed

            | Check | Status |
            |-------|--------|
            | Format & Clippy | ✅ Pass |
            | Tests | ✅ Pass |
            | Vocabulary Contract | ✅ Pass |
            ${deployInfo}

            ---
            <sub>Branch flow: \`${headBranch}\` → \`${baseBranch}\`</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Checks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
