name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

  # The published URIs are a permanent contract. This catches the failure
  # mode that matters most: a term that stops resolving, or one whose
  # definition silently changes shape.
  contract:
    runs-on: ubuntu-latest
    name: Vocabulary Contract
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Start server
        run: |
          LISTEN_ADDR=127.0.0.1:8080 ./target/release/bundu-vocab &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Vocabulary contract (every term in both representations, negotiation, 404)
        run: deno run --allow-net tools/contract.ts http://127.0.0.1:8080

  register:
    runs-on: ubuntu-latest
    name: Standards register
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Register is linted and its generated files are current
        run: python3 register/tools/register.py check

      - name: Register tool tests
        run: python3 -m unittest discover register/tools

      - name: Weather colour scales are valid and their results are current
        run: |
          python3 standards/weather-colour-scales/scales.py check
          python3 -m unittest standards/weather-colour-scales/test_scales.py

  # standards.bundu.org: the Worker that serves the register at a commit.
  endpoint:
    runs-on: ubuntu-latest
    name: Standards endpoint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install
        working-directory: workers/standards
        # Deno resolves the packages from package.json; package-lock.json stays as the lock
        # Cloudflare Workers Builds deploys from. esbuild and workerd need their install scripts.
        run: deno install --allow-scripts=npm:esbuild,npm:workerd

      - name: Tests
        working-directory: workers/standards
        run: deno task test:deno

      - name: Build
        working-directory: workers/standards
        run: deno task build

  standards-api:
    runs-on: ubuntu-latest
    name: Standards API (Rust Worker)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/standards-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/standards-api
      - name: Format
        run: cargo fmt --check
      - name: Clippy (native and wasm32)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: Tests (the cases of workers/standards/test/files.test.js)
        run: cargo test
      - name: Build for Workers
        run: cargo build --release --target wasm32-unknown-unknown

  comment:
    needs: [test, contract, register, endpoint, standards-api]
    # Push runs (main, staging) have no pull request to comment on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Status Comment
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;

            let deployInfo = '';
            if (baseBranch === 'main') {
              deployInfo = `
            ### 🚀 Deployment
            When merged, this deploys to **production**:
            - **URL:** https://vocab.bundu.org
            - **Fly app:** bundu-vocab (jnb)

            ⚠️ Term URIs are a permanent contract. A term that has been \
            published and embedded in someone's data must never change meaning or \
            stop resolving.`;
            }

            const comment = `## ✅ CI Checks Passed

            | Check | Status |
            |-------|--------|
            | Format & Clippy | ✅ Pass |
            | Tests | ✅ Pass |
            | Vocabulary Contract | ✅ Pass |
            ${deployInfo}

            ---
            <sub>Branch flow: \`${headBranch}\` → \`${baseBranch}\`</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Checks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
