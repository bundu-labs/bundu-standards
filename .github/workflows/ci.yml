name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue tests the exact commit it is about to merge.
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both sites are built and tested the same way: one Cargo workspace, one lockfile, one
  # Dockerfile with a BIN build argument. The matrix is the only difference between them.
  test:
    runs-on: ubuntu-latest
    name: Test & Build (${{ matrix.bin }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: vocab
            package: bundu-vocab
          - bin: standards
            package: bundu-standards-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --package ${{ matrix.package }} --package bundu-site -- --check

      - name: Clippy
        run: cargo clippy --package ${{ matrix.package }} --package bundu-site --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --package ${{ matrix.package }} --package bundu-site --all-targets --locked

      - name: Build release
        run: cargo build --package ${{ matrix.package }} --release --locked

      # The image Coolify builds: the root Dockerfile from the repository root, with BIN set to
      # this site. Start it as the container runs (non-root, port 8080) and ask it the same
      # question a health check asks.
      - name: Build the image
        run: docker build --build-arg BIN=${{ matrix.bin }} --tag ${{ matrix.bin }}:ci .

      - name: Start it and ask it
        run: |
          set -euo pipefail
          docker run --detach --name site --publish 8080:8080 ${{ matrix.bin }}:ci
          trap 'docker logs site; docker rm --force site' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          test "$(curl -sf http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          curl -sf -H 'Accept: text/html' http://127.0.0.1:8080/ | grep -q '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:8080/no-such-page-here)" = 404
          if [ "${{ matrix.bin }}" = standards ]; then
            curl -sf http://127.0.0.1:8080/register/index.json | grep -q '"standards"'
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = 405
          fi

  # The published URIs are a permanent contract. This catches the failure
  # mode that matters most: a term that stops resolving, or one whose
  # definition silently changes shape.
  contract:
    runs-on: ubuntu-latest
    name: Vocabulary Contract
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --release

      - name: Start server
        run: |
          LISTEN_ADDR=127.0.0.1:8080 ./target/release/bundu-vocab &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Vocabulary contract (every term in both representations, negotiation, 404)
        run: deno run --allow-net tools/contract.ts http://127.0.0.1:8080

  register:
    runs-on: ubuntu-latest
    name: Standards register
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Register is linted and its generated files are current
        run: python3 register/tools/register.py check

      - name: Register tool tests
        run: python3 -m unittest discover register/tools

      - name: Weather colour scales are valid and their results are current
        run: |
          python3 standards/weather-colour-scales/scales.py check
          python3 -m unittest standards/weather-colour-scales/test_scales.py

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Ecosystem record is valid and its generated files are current
        run: deno run --allow-read tools/ecosystem.ts check

      - name: Ecosystem tool tests
        run: deno test --allow-read tools/ecosystem_test.ts

  comment:
    needs: [test, contract, register]
    # Push runs (main) have no pull request to comment on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Status Comment
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;

            let deployInfo = '';
            if (baseBranch === 'main') {
              deployInfo = `
            ### 🚀 Deployment
            When merged, standards.bundu.org rebuilds on Coolify from the root \
            Dockerfile (BIN=standards), and vocab.bundu.org with BIN=vocab.

            ⚠️ Term URIs are a permanent contract. A term that has been \
            published and embedded in someone's data must never change meaning or \
            stop resolving.`;
            }

            const comment = `## ✅ CI Checks Passed

            | Check | Status |
            |-------|--------|
            | Vocabulary Contract | ✅ Pass |
            | Both sites: format, clippy, tests, image | ✅ Pass |
            ${deployInfo}

            ---
            <sub>Branch flow: \`${headBranch}\` → \`${baseBranch}\`</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Checks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
