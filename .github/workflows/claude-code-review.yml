name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "frontend/**/*.ts"
    #   - "frontend/**/*.tsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request for the Mukoko ID project (identity platform for Nyuchi Africa ecosystem).

            Key areas to focus on:
            - Code quality and TypeScript best practices
            - Potential bugs or issues
            - Security implications (especially around authentication, JWT handling, and user data)
            - Performance considerations for Cloudflare Workers and Next.js
            - Alignment with existing patterns in the codebase
            - OIDC/OAuth2 compliance for identity provider features
            - Test coverage

            Tech stack context:
            - API Worker: Cloudflare Workers with Hono
            - Frontend: Next.js 16 (App Router), React 19, Tailwind CSS 4
            - Authentication: Stytch (email magic links, OAuth, MFA)
            - Database: Cloudflare D1 (SQLite)

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # yamllint disable-line rule:line-length
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
