name: Deploy

# Every merge to main ships to vocab.bundu.org (Fly app bundu-vocab), after the
# same checks CI runs on pull requests. Needs the repo secret FLY_API_TOKEN, a
# deploy token scoped to the app (README, "Deployment"). Without it the deploy
# is skipped with a notice, not failed.
#
# A merge that bumps the version in Cargo.toml is also released: once the
# checks pass, the `release` job tags vX.Y.Z and creates a GitHub release
# whose notes are that version's CHANGELOG.md section. A merge that leaves the
# version alone finds its tag already there and does nothing. The release does
# not wait for the deploy, so a missing FLY_API_TOKEN never holds it back.
# It uses GITHUB_TOKEN (bundu-labs has no RELEASE_BUMP_TOKEN); nothing else
# here runs on a tag, so no other workflow needs to start from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Fly (bundu-vocab)
    needs: test
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            msg="FLY_API_TOKEN is not set. Create one with"
            msg="$msg 'fly tokens create deploy -a bundu-vocab' and add it as a repository secret."
            echo "::notice title=Deploy skipped::$msg"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        if: steps.token.outputs.present == 'true'

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only

      # The URIs are a permanent contract: check the live namespace still
      # answers after the rollout.
      - name: Smoke test vocab.bundu.org
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -sf https://vocab.bundu.org/health >/dev/null && break
            sleep 3
          done
          curl -sf -H 'Accept: application/ld+json' https://vocab.bundu.org/Family \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['@id']=='bundu:Family', d['@id']"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vocab.bundu.org/NotATerm)
          [ "$code" = "404" ] || { echo "::error::unknown term returned $code"; exit 1; }

  release:
    runs-on: ubuntu-latest
    name: Tag and release the version
    needs: test
    permissions:
      contents: write
    steps:
      # This job pushes the tag, so its checkout keeps GITHUB_TOKEN.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if git ls-remote --tags --refs origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          # The CHANGELOG section headed "## <version> (date)", up to the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add one before releasing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "bundu-vocab $version"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "bundu-vocab $version" --notes-file notes.md
