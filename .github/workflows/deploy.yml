name: Deploy

# Every merge to main ships to vocab.bundu.org (Fly app bundu-vocab), after the
# same checks CI runs on pull requests. Needs the repo secret FLY_API_TOKEN, a
# deploy token scoped to the app (README, "Deployment"). Without it the deploy
# is skipped with a notice, not failed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Fly (bundu-vocab)
    needs: test
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::FLY_API_TOKEN is not set. Create one with 'fly tokens create deploy -a bundu-vocab' and add it as a repository secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: steps.token.outputs.present == 'true'

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only

      # The URIs are a permanent contract: check the live namespace still
      # answers after the rollout.
      - name: Smoke test vocab.bundu.org
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -sf https://vocab.bundu.org/health >/dev/null && break
            sleep 3
          done
          curl -sf -H 'Accept: application/ld+json' https://vocab.bundu.org/Family \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['@id']=='bundu:Family', d['@id']"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vocab.bundu.org/NotATerm)
          [ "$code" = "404" ] || { echo "::error::unknown term returned $code"; exit 1; }
