# Production deploys to the Fly app `bundu-vocab`.
#
# Production deploys run from GitHub Actions after CI passes on `main`. This
# workflow starts when the "CI" workflow completes on `main`, and deploys
# only if that run succeeded and was started by a push (a merge), never by a
# pull request. It checks out the exact commit CI tested, not whatever `main`
# points at by then. `workflow_dispatch` re-runs a deploy by hand, from `main`
# only.
#
# The first deploy of an app is manual (`fly deploy`); every later one is CI.
# Nothing deploys from `staging`, and there is no Fly beta app (owner rule).
#
# Needs the repository secret FLY_API_TOKEN, a deploy token scoped to this one
# app. Without it the deploy is skipped with a notice, not failed.

name: Fly deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, in order; never cancel one half-way.
concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly (bundu-vocab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main')
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            msg="FLY_API_TOKEN is not set, so nothing was deployed. Add a deploy"
            msg="$msg token scoped to bundu-vocab as a repository secret."
            echo "::notice title=Fly deploy skipped::$msg"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.present == 'true'

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --config fly.toml --app bundu-vocab

      # The URIs are a permanent contract: check the live namespace still
      # answers after the rollout.
      - name: Smoke test vocab.bundu.org
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -sf https://vocab.bundu.org/health >/dev/null && break
            sleep 3
          done
          curl -sf -H 'Accept: application/ld+json' https://vocab.bundu.org/Family \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['@id']=='bundu:Family', d['@id']"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vocab.bundu.org/NotATerm)
          [ "$code" = "404" ] || { echo "::error::unknown term returned $code"; exit 1; }
