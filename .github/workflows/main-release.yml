name: Release

# Every release merge to main is tagged as the next MINOR above the highest
# tag (x.y.z -> x.y+1.0, org policy nyuchi/.github#80): once the checks pass,
# the `release` job tags vX.Y.Z and creates a GitHub release whose notes are
# that version's CHANGELOG.md section, or the "## Unreleased" section when
# there is none. A commit that is already tagged releases nothing. A MAJOR is
# only ever released by hand (run this workflow with bump: major).
#
# The version comes from the tags, through the org's next-version action. It
# is not read from Cargo.toml: that is the bundu-vocab crate's own version
# (issue #131).
#
# The file is named main-release.yml on purpose: the org's auto-release.yml
# (the bundu-release app) skips repos that have it and tag their own
# releases, so a release is tagged once, here.
#
# Deploys are not here: Coolify builds standards.bundu.org from Dockerfile and
# vocab.bundu.org from the same Dockerfile (BIN=vocab). The release never waits for either. It uses GITHUB_TOKEN
# (bundu-labs has no RELEASE_BUMP_TOKEN); nothing here runs on a tag, so no
# other workflow needs to start from it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the release bump (major is manual only).
        type: choice
        options: [minor, patch, major]
        default: minor

# One release at a time, in order.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  release:
    runs-on: ubuntu-latest
    name: Tag and release the version
    needs: test
    permissions:
      contents: write
    steps:
      # This job pushes the tag, so its checkout keeps GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the version
        id: v
        uses: nyuchi/.github/.github/actions/next-version@a15f924d44ec13cfe045908059e1628f0ab41733  # v0.17.0
        with:
          channel: main
          bump: ${{ inputs.bump || '' }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Tag and release the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # A re-run, or a commit that is already released: nothing to do. A
          # lightweight tag lists the commit itself, an annotated one its ^{}.
          existing=$(git ls-remote --tags origin 'refs/tags/v*' |
            awk -v h="$head" '$1 == h { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
          if [ -n "$existing" ]; then
            echo "$head is already released as $existing; nothing to release."
            exit 0
          fi
          # The CHANGELOG section headed "## <version> ...", else "## Unreleased",
          # up to the next "## " heading.
          section() {
            awk -v v="$1" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          section "$VERSION" > notes.md
          [ -s notes.md ] || section Unreleased > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' or '## Unreleased' section."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "bundu-standards $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --latest --title "bundu-standards $VERSION" --notes-file notes.md
          echo "Released $TAG at $head." | tee -a "$GITHUB_STEP_SUMMARY"
