name: Release

# A merge to main that bumps the version in Cargo.toml is released: once the
# checks pass, the `release` job tags vX.Y.Z and creates a GitHub release
# whose notes are that version's CHANGELOG.md section. A merge that leaves the
# version alone finds its tag already there and does nothing. Deploys are not
# here: fly-deploy.yml ships to the Fly app bundu-vocab after CI passes on
# main, and the release never waits for it.
# It uses GITHUB_TOKEN (bundu-labs has no RELEASE_BUMP_TOKEN); nothing else
# here runs on a tag, so no other workflow needs to start from it.
#
# The version follows the org policy (nyuchi/.github#80): a release to main is
# the next MINOR above the highest tag (x.y.z -> x.y+1.0); merges into staging
# are tagged as patches by staging-version.yml; a MAJOR is only ever released
# by hand (run this workflow with bump: major). The shared next-version action
# refuses any other version before anything is tagged.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the release bump (major is manual only).
        type: choice
        options: [minor, patch, major]
        default: minor

# One release at a time, in order.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  release:
    runs-on: ubuntu-latest
    name: Tag and release the version
    needs: test
    permissions:
      contents: write
    steps:
      # This job pushes the tag, so its checkout keeps GITHUB_TOKEN.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the version
        id: read
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Check it against the versioning policy
        uses: nyuchi/.github/.github/actions/next-version@de909ab7468d998ba2cf87416ac2042616eba75d  # main, 2026-10-04
        with:
          channel: main
          bump: ${{ inputs.bump || '' }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}
          proposed: ${{ steps.read.outputs.version }}

      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if git ls-remote --tags --refs origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          # The CHANGELOG section headed "## <version> (date)", up to the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add one before releasing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "bundu-vocab $version"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "bundu-vocab $version" --notes-file notes.md
