[package]
name = "bundu-vocab"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["Bundu Foundation <foundation@bundu.org>"]
repository = "https://github.com/bundu-labs/bundu-standards"
homepage = "https://vocab.bundu.org"
description = "The Bundu vocabulary — RDF terms for concepts schema.org has no word for"

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["trace", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
