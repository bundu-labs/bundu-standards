app = "bundu-vocab"
primary_region = "jnb"  # Johannesburg

[build]
  dockerfile = "Dockerfile"

[env]
  LISTEN_ADDR = "0.0.0.0:8080"
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  # A vocabulary URI that 404s is worse than one that never existed —
  # consumers cache the failure and stop trusting the namespace. Keep a
  # machine warm rather than paying a cold start on the first dereference.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 600

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
