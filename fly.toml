app = "bundu-identity"
primary_region = "jnb"  # Johannesburg

[build]
  dockerfile = "Dockerfile"

[env]
  LISTEN_ADDR = "0.0.0.0:8080"
  LOG_LEVEL = "info"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"        # Auth gateway must be hot
  auto_start_machines = true
  min_machines_running = 2          # HA: at least 2 instances

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets are set via `fly secrets set` and never committed:
#   WORKOS__CLIENT_ID, WORKOS__API_KEY, WORKOS__REDIRECT_URI,
#   SUPABASE__URL, SUPABASE__SERVICE_ROLE_KEY,
#   JWT__SIGNING_SECRET,
#   CLOUDFLARE__ACCOUNT_ID, CLOUDFLARE__QUEUES_API_TOKEN
