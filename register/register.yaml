    status: adopted
    decided: OD (register P-6)
    url: https://www.rfc-editor.org/rfc/rfc9068
    notes: "Apply as api-gateway PR #126 (ES256 JWTs and JWKS) lands."
  - id: w3c_vc
    name: W3C Verifiable Credentials Data Model
    domain: identity
    category: data_format
    steward: W3C
    commitment: "2.0"
    current: 2.0, W3C Recommendation (2025-05-15)
    governs: Credentials issued at verification; agent payment mandates.
    status: adopted
    decided: Live validators; AT bushtrade-mcp/src/ap2.ts
    evidence:
      - entity.verifications.issuedVcId
      - identity.credentials.credentialData (VC JWT)
    url: https://www.w3.org/TR/vc-data-model-2.0/
  - id: w3c_did
    name: W3C Decentralized Identifiers (DID)
    domain: identity
    category: identifier_scheme
    steward: W3C
    commitment: DID Core 1.0; 1.1 when it is a Recommendation
    current: Core 1.0 Rec (2022); DID 1.1 Candidate Rec (2026-03-05)
    governs: Credential subjects; the MIT when the token stage arrives (A§19, deferred).
    status: adopted
    decided: Live validators; OD (register P-7)
    evidence:
      - identity.credentials.credentialData (DID document)
    url: https://www.w3.org/TR/did-1.1/
  - id: webauthn
    name: WebAuthn
    domain: identity
    category: protocol
    steward: W3C / FIDO Alliance
    commitment: Level 3
    current: Level 3, W3C Recommendation (2026-08-25); checked 2026-10-07
    governs: Passkeys.
    status: adopted
    decided: Live validators
    evidence:
      - identity.credentials.credentialData (WebAuthn credential)
    url: https://www.w3.org/TR/webauthn-3/
  - id: nist_sp_800_63_4
    name: NIST SP 800-63-4 Digital Identity Guidelines
    domain: identity
    category: specification
    steward: NIST
    commitment: SP 800-63-4 (63A-4 identity proofing as the assurance mapping; 63B-4 AAL for authenticators)
    current: SP 800-63-4 Final (2025-07-31)
    governs: >-
      The reference mapping for verification assurance. The platform's own
      levels (0 none, 1 otp, 2 documented, 3 government, 4 licensed) map to
      IAL as follows: 2 documented to IAL1, 3 government and 4 licensed to
      IAL2. Levels 0 and 1 sit below IAL1. Attestations (community,
      business, representative, domain) are platform terms with no IAL. The
      mapping is a reference: the platform does not claim certified IAL
      conformance.
    status: adopted
    decided: OD 2026-10-03 (mukoko-dev/nyuchi-identity#23, decision D3)
    evidence:
      - api-gateway gateway/lib/assurance.py
    url: https://csrc.nist.gov/pubs/sp/800/63/4/final
    notes: >-
      eIDAS levels of assurance and ISO/IEC 18013-5/-7 (mDL) are parked by
      the same decision; neither is listed.
  - id: sd_jwt_vc
    name: SD-JWT-based Verifiable Credentials (SD-JWT VC)
    domain: identity
    category: data_format
    steward: IETF OAuth Working Group
    commitment: Track the draft; the RFC when published. Built on SD-JWT (RFC 9901).
    current: draft-ietf-oauth-sd-jwt-vc-19 (2026-08-31), in IESG processing; SD-JWT is RFC 9901
    governs: >-
      Selective disclosure of verification outcomes, so a holder can prove
      "government-verified" or "over 18" without the document. Also the
      encoding AP2 v0.2 mandates use (gap G-2).
    status: proposed
    decided: OD 2026-10-03 (mukoko-dev/nyuchi-identity#23, decision D3), listed as Proposed
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-sd-jwt-vc/

