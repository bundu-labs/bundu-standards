  - id: iptc_ninjs
    name: IPTC ninjs (News in JSON)
    domain: news
    category: data_format
    steward: IPTC (International Press Telecommunications Council)
    commitment: >-
      ninjs 3.2 for new work, as IPTC recommends for a project starting now; 1.7
      and 2.3 are the latest of the older series
    current: >-
      Version 3.2, approved October 2025 (README of iptc/newsinjson; tag v3.2,
      2025-11-10; the JSON Schema ninjs-schema_3.2.json is published at
      iptc.org/std/ninjs). The latest of each series are 1.7, 2.3 and 3.2; 3.x is
      not backwards compatible with 2.x or 1.x. IPTC's ninjs page
      (iptc.org/standards/ninjs, last modified 2025-01-22) still names 3.0
      (approved October 2024) as the current version, which is older than its own
      schema directory. Read 2026-11-11, at iptc/newsinjson commit f2ee6fc
      (2025-11-10).
    governs: >-
      The JSON form of a news item (and, from 3.x, of an event or a planning
      item): headlines, bodies, language, firstCreated and versionCreated,
      subjects, people, organisations, places, renditions, rights and
      digitalSourceType. It is the target shape of news API output, and what
      `NewsArticle` maps to closely.
    status: adopted
    decided: >-
      The October 2026 standards audit (nyuchi/data-infra#94,
      docs/standards-audit-2026-10.md, 2026-10-07) found ninjs in use as the news
      target shape and not in the register. #94 lists it and does not adopt it
      ("Adding a standard is an owner decision"), so it was registered as proposed until the owner adopted it.
      Listed in the register on 2026-11-11, tracked in
      nyuchi/data-infra#179.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://iptc.org/std/ninjs/
    docs: https://github.com/iptc/newsinjson
    notes: >-
      Licence: the JSON Schema is Creative Commons Attribution 4.0 (stated in the
      schema's own description, "copyright 2025 IPTC"); the repository
      (LICENSE, "Copyright (c) 2024 International Press Telecommunications
      Council (IPTC)") is MIT. The 3.2 schema has a `digitalSourceType` property
      whose suggested vocabulary is the IPTC Digital Source Type
      (iptc_digital_source_type). Platform use: `NewsArticle` has a close mapping
      `iptc:ninjs` that expands under NewsCodes and does not resolve, and the
      audit names ninjs 3.2 as the target shape of the news APIs
      (nyuchi/data-infra#86). Added from nyuchi/data-infra#94 and #179.
  - id: iptc_digital_source_type
    name: IPTC Digital Source Type (NewsCodes)
    domain: news
    category: vocabulary
    steward: IPTC (International Press Telecommunications Council)
    commitment: >-
      Track the live vocabulary; store the concept URI
      (`http://cv.iptc.org/newscodes/digitalsourcetype/<term>`), not a label
    current: >-
      Scheme released 2024-10-23 (dateReleased in the scheme's JSON, which is also
      the date of the latest change to any concept); the vocabulary carries no
      version number, so a consumer pins the release date. 20 concepts: 17 current
      and 3 retired (minorHumanEdits, softwareImage, digitalArt). Read 2026-11-11,
      at cv.iptc.org/newscodes/digitalsourcetype/ (HTML and JSON).
    governs: >-
      Where a piece of media came from: captured, digitised, human-edited,
      algorithmically altered, composite, or made by a trained model. It marks
      AI-made content, for example `trainedAlgorithmicMedia` ("Created using
      Generative AI") and `compositeWithTrainedAlgorithmicMedia` ("Edited using
      Generative AI"). The data platform uses it to mark AI-made article text and
      images.
    status: adopted
    decided: >-
      The October 2026 standards audit (nyuchi/data-infra#94,
      docs/standards-audit-2026-10.md, 2026-10-07) found it the shared code list
      for AI provenance on content and not in the register. #94 lists it and does
      not adopt it ("Adding a standard is an owner decision"), so it was registered as proposed until the owner
      adopted it. Listed in the register on 2026-11-11,
      tracked in nyuchi/data-infra#179.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://cv.iptc.org/newscodes/digitalsourcetype/
    notes: >-
      Licence: Creative Commons Attribution 4.0 (the vocabulary page: "Copyright
      2024 IPTC ... The Creative Commons Attribution (CC BY) 4.0 license applies
      to all NewsCodes"; the scheme's JSON names IPTC as copyright holder and
      links CC BY 4.0). It is data, not code. The scheme's own definition says
      "from which source a digital image was created" and the concept definitions
      say "media"; none of the 20 concept definitions names text, so using the
      codes for AI-made article text is the platform's application of them, not
      something IPTC states. C2PA 2.4 (c2pa) takes these URIs in its
      digitalSourceType field, and the ninjs 3.2 schema (iptc_ninjs) has a
      digitalSourceType property that suggests this vocabulary (both read
      2026-11-11). Platform use: the AI-made fields of an article (aiSummary on
      99%, aiKeywords, aiSentiment, aiCategories) carry no source type today
      (audit 2026-10-07, nyuchi/data-infra#86). Added from nyuchi/data-infra#94
      and #179.
