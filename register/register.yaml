      - planner.schedules.repeatFrequency
    url: https://www.rfc-editor.org/rfc/rfc3339
    foundational: true
  - id: iso_3166
    name: ISO 3166-1 / ISO 3166-2
    domain: core
    category: identifier_scheme
    steward: ISO
    commitment: alpha-2 country codes; 3166-2 subdivision codes
    current: Not verified (iso.org returned 403)
    governs: Country and subdivision codes.
    status: adopted
    decided: Live validators
    evidence:
      - places.placesGeo.isoCode
      - knowledge.contributors.countryCode
      - knowledge.contributors.contributionCountries
      - knowledge.documentReferences.countryCode
    url: https://www.iso.org/iso-3166-country-codes.html
  - id: iso_4217
    name: ISO 4217
    domain: core
    category: identifier_scheme
    steward: ISO (list maintained by SIX)
    commitment: Alphabetic currency codes, current list
    current: 2015 edition; Amendment 180
    governs: Currency codes on orders, offers and prices.
    status: adopted
    decided: Live validators
    evidence:
