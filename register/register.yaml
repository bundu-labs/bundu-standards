# The standards register, as data. The tables in REGISTER.md and the
# integrations.standards seed documents are generated from this file
# (python3 register/tools/register.py write); edit here, never in the tables.
#
# One entry per standard:
#   id            slug; the MongoDB _id is `standard_<id>`
#   name          displayName
#   domain        the REGISTER.md section it is listed under
#   category      integrations.standards category enum
#   steward       stewardOrganisation
#   commitment    versionCommitment: the version the platform holds itself to
#   current       what the official source showed on 2026-10-02, or on the
#                 date the entry gives (docs/standards-audit-2026-10.md)
#   governs       description: what it governs on the platform
#   status        adopted | proposed
#   decided       why it is adopted: the owner's document or decision
#   evidence      where the platform already cites it. `collection.field` is a
#                 live MongoDB validator (api-gateway mongo_catalog.json).
#   url           specificationUrl
#   notes         usageNotes
#   foundational  bundu.isFoundational: true when other standards build on it
#   rationale     bundu.adoptionRationale
#
# Evidence keys: A§ The Nyuchi Architecture v5.0.0; MZ Mzizi doctrine; AT
# mzizi-dev/agent-tools; SP api-gateway db/spine/README.md; ID nyuchi-identity
# ADR 0001; OD owner decision 2026-10-02.

domains:
  core: "Core: the identity of data"
  identity: Identity, trust and verification
  agents: Agents and machine-readable surfaces
  communication: Communication and federation
  commerce: Commerce and payments
  news: News, media and publishing
  places: Places and geography
  transport: Transport
  events: Events
  weather: Weather and environment
  health: Health
  jobs: Jobs and skills
  learning: Education and learning
  accessibility: Accessibility
  open-data: Open data
  streaming: Event streaming and APIs
  first-party: First-party protocols

standards:
  # --- core ---------------------------------------------------------------
  - id: schema_org
    name: Schema.org
    domain: core
    category: vocabulary
    steward: Schema.org Community Group (W3C)
    commitment: Current release (30.1 on 2026-10-02); track releases
    current: Release 30.1 (2026-09-16)
    governs: >-
      The vocabulary of every record: every table and collection maps to a
      type (Person, Organization, NewsArticle, Event, Place, Product, Offer,
      JobPosting, Course, ClaimReview, Review, Action types).
    status: adopted
    decided: A§17 ("Non-negotiable"); A§8.1; MZ N11
    evidence:
      - commerce.products.offers
      - commerce.contentUnlocks.actionStatus
      - engagement.reviews.reviewHeadline
      - knowledge.documentReferences.schemaOrgType
      - entity.entities.schemaOrgType
      - "and 34 more validator descriptions"
    url: https://schema.org/docs/releases.html
    foundational: true
    rationale: The shared meaning every store and every surface is built on.
  - id: schema_org_claimreview
    name: Schema.org ClaimReview
    domain: news
    category: vocabulary
    steward: Schema.org Community Group (W3C)
    commitment: Schema.org core type
    current: Core type
    governs: Fact-checks in News, and public Kweli verification outcomes.
    status: adopted
    decided: OD (register P-11)
    url: https://schema.org/ClaimReview
    rationale: How search engines and agents read a fact-check.
  - id: json_ld
    name: JSON-LD
    domain: core
    category: data_format
    steward: W3C
    commitment: "1.1"
    current: 1.1, W3C Recommendation (2020-07-16); 1.2 in Working Group
    governs: The public serialisation of every record; the generated context maps slots to Schema.org.
    status: adopted
    decided: A§17 ("Every public page emits JSON-LD"); MZ N11
    evidence:
      - knowledge.documentReferences.schemaOrgType
      - api-gateway gateway/lib/jsonld.py
    url: https://www.w3.org/TR/json-ld11/
    foundational: true
  - id: vocab_bundu
    name: Bundu vocabulary (vocab.bundu.org)
    domain: core
    category: vocabulary
    steward: Bundu Foundation
    commitment: >-
      Live terms (CC0); additions by review in bundu-labs/bundu-standards;
      flat URIs (vocab.bundu.org/<term>); stable terms never change meaning
    current: >-
      0.1.4, 39 terms (38 stable, 1 testing); 0.1.3 made the AI guardrail
      terms stable, and 0.1.4 adds notificationPreference (testing). Live
      once the bundu-vocab deploy runs.
    governs: >-
      Terms Schema.org lacks. Stable: Family, Community, PlaceOwner,
      PublishingHouse, NewsDesk, recognitionBasis, verificationTier,
      ubuntuScore, communityVouches, isInformal, assuranceLevel, attestation,
      defaultFamily, kAnonymity, maxReidentificationRisk, and, since BAGS
      was published on bundu.org, the AI guardrail terms (AIGuardrail,
      PlatformGuardrail, EntityGuardrail, GuardrailCategory,
      guardrailSeverity, guardrailCategory, appliesToSurface,
      enforcementLayer, isCoreGuardrail, standardVersion) and the BAGS set
      with BAGS-01 to BAGS-12. Testing: notificationPreference
      (identity.persons.notificationPreferences). Proposed, not yet in the
      live index: trustScore (a cached schema.org Rating per trust context
      in `bundu`, nyuchi/api-gateway#272); added in bundu-labs/bundu-standards
      before any app emits it.
    status: adopted
    decided: ID (ADR 0001 §5); OD for the canonical-schema terms (bundu-labs/bundu-standards#11)
    evidence:
      - entity.entities.additionalType
      - entity.entities.recognitionBasis
      - identity.persons.notificationPreferences
      - api-gateway gateway/routers/open_data.py (kAnonymity, maxReidentificationRisk)
    url: https://vocab.bundu.org
    docs: https://github.com/bundu-labs/bundu-standards
    notes: >-
      Served by the Fly app bundu-vocab (jnb) from bundu-labs/bundu-standards.
      Every term dereferences to JSON-LD, or HTML when asked for it. A term
      the platform emits under vocab.bundu.org must be in the live index.
    foundational: true
    rationale: Lets an entity keep a valid Schema.org @type while saying what it really is.
  - id: uuid
    name: UUID
    domain: core
    category: identifier_scheme
    steward: IETF
    commitment: RFC 9562; UUIDv7 for new ids, existing v4 ids stay valid
    current: RFC 9562 (May 2024), obsoletes RFC 4122
    governs: Every record id (`_id` / `id`).
    status: adopted
    decided: A§5 Layer 3 ("`_id` is a UUID string"); SP; OD for RFC 9562 and v7 (register P-3)
    evidence:
      - identity.persons._id
      - engagement.interestCategories._id
      - suggestions.places._id (already UUIDv7)
    url: https://www.rfc-editor.org/rfc/rfc9562
    notes: >-
      integrations.standards ids are `standard_<slug>` and
      suggestions.places ids are `sug_` + UUIDv7: documented exceptions.
    foundational: true
    rationale: v7 ids are time-ordered, which helps Cassandra and Doris clustering.
  - id: iso_8601
    name: ISO 8601 / RFC 3339
    domain: core
    category: encoding
    steward: ISO / IETF
    commitment: ISO 8601-1:2019, profiled by RFC 3339 for timestamps
    current: ISO 8601-1:2019 + Amd 1:2022; RFC 3339 (updated by RFC 9557)
    governs: Date-times in JSON, events and APIs; durations (`PT2H`).
    status: adopted
    decided: Live validators
    evidence:
