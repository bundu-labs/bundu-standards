  - id: h3
    name: H3 hexagonal hierarchical geospatial index
    domain: places
    category: specification
    steward: Uber Technologies, Inc. (an open-source project; no standards body or foundation)
    commitment: >-
      Release 4.x, the latest being 4.5.0; the library follows Semantic Versioning,
      so a consumer pins the release it builds against
    current: >-
      Release 4.5.0 (tag v4.5.0, 2026-05-21), the latest stable release. Read
      2026-11-11, at tag v4.5.0 (1b536c3) and at master 1195856 (2026-11-10),
      whose VERSION file still reads 4.5.0 and whose CHANGELOG has an Unreleased
      section of fixes only. The documentation site (h3geo.org) carries the 4.x
      and 3.x documentation. The audit (2026-10-07) recorded 4.5.0.
    governs: >-
      The cell id of a place or event on a hexagonal, hierarchical global grid, so
      geography can be joined and aggregated across datasets at a chosen
      resolution: the `*_by_cell_*` tables planned in Doris and Cassandra. There
      are 16 resolutions (0 to 15); resolution 0 has 122 base cells (110 hexagons
      and 12 pentagons) and each finer resolution has about one seventh of the
      area (aperture 7).
    status: adopted
    decided: >-
      The October 2026 standards audit (nyuchi/data-infra#94,
      docs/standards-audit-2026-10.md, 2026-10-07) found H3 planned for the data
      platform and not in the register. #94 lists it and does not adopt it
      ("Adding a standard is an owner decision"), so it was registered as proposed until the owner adopted it.
      Listed in the register on 2026-11-11, tracked in
      nyuchi/data-infra#179.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://h3geo.org/
    docs: https://github.com/uber/h3
    notes: >-
      Licence: Apache-2.0 for the library and its documentation (LICENSE; NOTICE
      "Copyright 2017-2021 Uber Technologies, Inc."; the README names Apache 2.0
      and also carries DGGRID, "Copyright (c) 2015 Southern Oregon University").
      The grid is defined by the documentation at h3geo.org and by the library,
      which is the reference implementation: no separate specification document
      and no separate documentation licence is stated, and the site source
      (website/ in the repository) sits under the same LICENSE. Governance: an
      Uber project, and contributions need the Uber Contributor License Agreement
      (README); no other steward is named. The grid sits on a sphere with the
      WGS 84 authalic radius (the core-library overview). Platform use: H3 cells
      are the key of the `*_by_cell_*` tables planned for Doris and Cassandra
      (nyuchi/data-infra#22, Phase 4 #59); the audit found no H3 cell on a place
      or event and no slot for one in the model (nyuchi/data-infra#87). GeoJSON
      stays the geometry (geojson): an H3 cell id is an index, not a geometry.
      Added from nyuchi/data-infra#94 and #179.
