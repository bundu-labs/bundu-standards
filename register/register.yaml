  - id: spdx
    name: SPDX (specification and License List)
    domain: open-data
    category: identifier_scheme
    steward: Linux Foundation (SPDX project)
    commitment: >-
      The License List short identifier as the licence value (release 3.29.0
      now); for a document that carries it, the specification version, 3.0.1 now
    current: >-
      Specification 3.0.1 (tag 3.0.1 in spdx/spdx-3-model, 2024-12-12; the
      specification changelog dates it 2024-12-17; spdx.github.io/spdx-spec
      redirects to v3.0.1). spdx.dev's specifications page still lists 3.0 as the
      current version; 3.1 is a release candidate (3.1-rc1) and unreleased.
      License List 3.29.0 (2026-09-16; 740 licences). ISO/IEC 5962:2021 is SPDX
      2.2.1 (Edition 1, 2021-08), at stage 90.92 "International Standard to be
      revised" since 2026-01-07; ISO/IEC PRF 5962 (Edition 2, SPDX 3.0) will
      replace it, at stage 50.20 since 2026-10-19 with publication shown as
      2026-12. Read 2026-11-11, at spdx-3-model ae9ba4b (2026-11-10), spdx-spec
      d206df8 (2026-11-06), license-list-data tag v3.29.0 and the ISO pages
      (reached through Firecrawl: iso.org returned 403 to a direct request).
    governs: >-
      The identifier of a licence (`MIT`, `Apache-2.0`, `CC-BY-4.0`) and licence
      expressions (a licence `WITH` an exception), so a provider's licence is a
      code and not free text: `integrations.providers.license.spdxIdentifier`.
    status: adopted
    decided: >-
      The October 2026 standards audit (nyuchi/data-infra#94,
      docs/standards-audit-2026-10.md, 2026-10-07) found `spdxIdentifier` on the
      integrations providers and SPDX not in the register. #94 lists it and does
      not adopt it ("Adding a standard is an owner decision"), so it was registered as proposed until the owner
      adopted it. Listed in the register on 2026-11-11,
      tracked in nyuchi/data-infra#179.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://spdx.dev/use/specifications/
    docs: https://spdx.org/licenses/
    notes: >-
      Standing: ISO's page for SPDX 3.0 is a draft in the approval phase, so
      SPDX 3.x is not yet an ISO edition; spdx.dev says "The SPDX specification
      is an international open standard (ISO/IEC 5962:2021)", which is the 2.2.1
      text. Licence: the specification is under the Community Specification
      License 1.0, with pre-existing portions under CC-BY-3.0 (spdx-spec LICENSE;
      spdx.dev legal notices); the SPDX 3 model repository is under the Community
      Specification License 1.0 (License.md). The licence of the License List
      data is not recorded: no licence file or statement was found for it in
      spdx/license-list-data, spdx/license-list-XML or on spdx.org/licenses, and
      each licence text belongs to its licensor. Platform use:
      `integrations.providers.license.spdxIdentifier` holds a licence identifier
      (audit 2026-10-07: providers are live in MongoDB `integrations.providers`
      and not yet modelled). Added from nyuchi/data-infra#94 and #179.
