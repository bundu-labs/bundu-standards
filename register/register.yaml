    url: https://csrc.nist.gov/pubs/sp/800/63/4/final
    notes: >-
      eIDAS levels of assurance and ISO/IEC 18013-5/-7 (mDL) are parked by
      the same decision; neither is listed.
  - id: sd_jwt_vc
    name: SD-JWT-based Verifiable Credentials (SD-JWT VC)
    domain: identity
    category: data_format
    steward: IETF OAuth Working Group
    commitment: Track the draft; the RFC when published. Built on SD-JWT (RFC 9901).
    current: draft-ietf-oauth-sd-jwt-vc-19 (2026-08-31), in IESG processing; SD-JWT is RFC 9901
    governs: >-
      Selective disclosure of verification outcomes, so a holder can prove
      "government-verified" or "over 18" without the document. Also the
      encoding AP2 v0.2 mandates use (gap G-2).
    status: adopted
    decided: OD 2026-10-03 (mukoko-dev/nyuchi-identity#23, decision D3), listed as Proposed.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-sd-jwt-vc/
  - id: iso_17442
    name: Legal Entity Identifier (LEI, ISO 17442)
    domain: identity
    category: identifier_scheme
    steward: ISO (ISO/TC 68/SC 8); the LEI system is run by GLEIF
    commitment: >-
      ISO 17442-1:2020 for the LEI and its assignment; ISO 17442-2:2020 for an LEI
      in a digital certificate
    current: >-
      ISO 17442-1:2020 "Legal entity identifier (LEI) - Part 1: Assignment",
      Edition 1, published 2020-08, International Standard confirmed 2026-01-21
      (stage 90.93; ISO: "last reviewed and confirmed in 2026. Therefore this
      version remains current"). ISO 17442-2:2020 "Part 2: Application in digital
      certificates", Edition 1, published 2020-08, confirmed 2026-01-20. ISO
      17442:2019 is withdrawn. Read 2026-11-11, at iso.org/standard/78829.html and
      /79917.html (reached through Firecrawl: iso.org returned 403 to a direct
      request) and at gleif.org.
    governs: >-
      The identifier of a legal entity: a 20-character alphanumeric code that is
      unique and stands for one entity, so an organisation can be named across
      systems and checked against GLEIF's Global LEI Index (`schema:leiCode`).
      Proposed for B2B verification of organisations; no LEI is stored today.
    status: adopted
    decided: >-
      The October 2026 standards audit (nyuchi/data-infra#94,
      docs/standards-audit-2026-10.md, 2026-10-07) lists LEI as proposed, not yet
      used, for B2B verification. #94 lists it and does not adopt it ("Adding a
      standard is an owner decision"), so it was registered as proposed until the owner adopted it. Listed in the
      register on 2026-11-11, tracked in nyuchi/data-infra#179.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://www.iso.org/standard/78829.html
    docs: https://www.gleif.org/en/about-lei/iso-17442-the-lei-code-structure
    notes: >-
      Licence: the standard's text is sold by ISO (CHF 67 for Part 1; "(c) ISO"
      on the page) and no open licence for the text was found. The data is open:
      GLEIF's LEI Data Terms
      of Use (gleif.org/en/meta/lei-data-terms-of-use) say the data available
      through its access service "are provided under the CC0 licence", and GLEIF
      describes the LEI as "A public good, available free of charge to all users".
      Steward: ISO/TC 68/SC 8 is the responsible committee; GLEIF (Global Legal Entity
      Identifier Foundation), a Swiss not-for-profit foundation incorporated by
      the Financial Stability Board, runs the system with the local operating
      units (LOUs) it accredits, under the Regulatory Oversight Committee.
      Scope: legal entities, including international branches and individuals
      acting in a business capacity (sole traders are an ISO example), and not
      natural persons. Schema.org has the property `leiCode` ("An organization
      identifier that uniquely identifies a legal entity as defined in ISO
      17442"). Platform use: none yet; the entity model has `taxId`,
      `registrationNumber`, `gln` and `openCorporatesId` and no `leiCode` (audit
      2026-10-07, nyuchi/data-infra#94). Added from nyuchi/data-infra#94 and
      #179.

  # --- devices ----------------------------------------------------------------
  - id: rfc_8628
    name: OAuth 2.0 Device Authorization Grant
    domain: devices
    category: rfc
    steward: IETF
    commitment: RFC 8628
    current: RFC 8628 (Aug 2019), Proposed Standard; read at source 2026-11-11
    governs: >-
      Pairing a display or desktop that has no keyboard to a household: the
      device shows a user_code and a QR code of verification_uri_complete, a
      household member approves on their phone, and the device polls the
      token endpoint (authorization_pending, slow_down, access_denied,
      expired_token). Records: device.pairings (model DevicePairing).
    status: adopted
    decided: >-
      Owner instruction 2026-11-11, in the coordinator's chat: "Go ahead and adapt
      the standards, push and release to production across the repos"; the
      coordinator read "adapt" as "adopt" the three device-domain standards
      proposed that day (the Mukoko Home design, mukoko-dev/mukoko-home#24)
    url: https://www.rfc-editor.org/rfc/rfc8628
    notes: >-
      Run by the Nyuchi API (/v1/devices) behind id-worker's
      /oauth/device_authorization and /oauth/token. WorkOS CLI Auth was not
      used: it issues the person's own tokens, and a shared device must
      never hold a person's token.
  - id: rfc_6749
    name: The OAuth 2.0 Authorization Framework
    domain: devices
    category: rfc
    steward: IETF
    commitment: RFC 6749 (refresh token grant, §6), with rotation and reuse detection as OAuth 2.1 and RFC 9700 §4.14 require
    current: >-
      RFC 6749 (Oct 2012), Proposed Standard, updated by RFC 8252, RFC 8996 and
      RFC 9700; read at source 2026-11-11. The OAuth 2.1 draft is tracked in the
      oauth_2_1 entry
    governs: >-
      A paired device's refresh token: opaque, stored only as a hash,
      rotated on every use, and a replayed old token revokes the session.
      Records: device.sessions (model DeviceSession).
    status: adopted
    decided: >-
      Owner instruction 2026-11-11, in the coordinator's chat: "Go ahead and adapt
      the standards, push and release to production across the repos"; the
      coordinator read "adapt" as "adopt" the three device-domain standards
      proposed that day (the Mukoko Home design, mukoko-dev/mukoko-home#24)
    url: https://www.rfc-editor.org/rfc/rfc6749
    notes: >-
      OAuth 2.1 (adopted) is the platform's commitment; this entry names the
      RFC the device grant (RFC 8628) extends, until OAuth 2.1 is an RFC.
