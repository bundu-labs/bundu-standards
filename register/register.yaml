  # --- proposed 2026-10-29: the standards the weather and agriculture models
  # --- should have been built on. Not yet checked at source; adopt on the owner's yes.
  - id: ucum
    name: Unified Code for Units of Measure (UCUM)
    domain: core
    category: specification
    steward: Regenstrief Institute
    commitment: Every stored quantity declares its unit as a UCUM code, once
    current: Not yet checked at source (2026-10-29)
    governs: >-
      The unit of every measured value (Cel, hPa, m/s, mm, %), so a number never
      travels without a machine-readable unit and a provider's own unit (knots,
      km/h) never reaches storage.
    status: proposed
    decided: Owner direction 2026-10-29, adopt global standards and convert at the edge; listing proposed
    url: https://ucum.org/ucum
    notes: CF Conventions accepts UCUM-form units, which is how the two fit together.
  - id: sosa_ssn
    name: Semantic Sensor Network ontology (SOSA/SSN)
    domain: weather
    category: vocabulary
    steward: W3C and OGC
    commitment: Observations are modelled as SOSA observations
    current: Not yet checked at source (2026-10-29)
    governs: >-
      The shape of an observation: what was observed (observed property), the
      feature of interest, the sensor or station that made it, the result and its
      phenomenon and result times.
    status: proposed
    decided: Owner direction 2026-10-29, adopt global standards and convert at the edge; listing proposed
    url: https://www.w3.org/TR/vocab-ssn/
  - id: ogc_sensorthings
    name: OGC SensorThings API
    domain: weather
    category: protocol
    steward: Open Geospatial Consortium
    commitment: The standard API for stations, datastreams and observations
