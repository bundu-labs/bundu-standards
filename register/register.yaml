  - id: bags
    name: Bundu AI Guardrails Standard (BAGS)
    domain: agents
    category: specification
    steward: Bundu Foundation
    commitment: 1.0.0 (semver; a change to a published rule bumps the version)
    current: >-
      1.0.0, owner-approved; published on bundu.org on 2026-10-04 by the
      Bundu Foundation (publisher of record), maintained by Nyuchi Africa;
      served by the Nyuchi API
    governs: >-
      The core, public platform guardrails every AI surface applies, BAGS-01
      to BAGS-12, and the categories they belong to
      (shamwari.guardrails, shamwari.guardrailStandard).
    status: adopted
    decided: OD (BAGS 1.0.0 rule ids approved; bundu-labs/bundu-standards#11)
    evidence:
      - api-gateway db/seeds/bags-1.0.0.json (the seed)
      - api-gateway GET /v1/ai/guardrails/standard (public, CC BY 4.0)
      - bundu.org /research/standards/ai-guardrails (and .json)
      - bundu-standards standards/ai-guardrails/bags-1.0.0.json (snapshot)
    url: https://www.bundu.org/research/standards/ai-guardrails
    notes: >-
      Licence CC BY 4.0 (cc_by_4). Publisher of record: the Bundu
      Foundation; maintainer and operator: Nyuchi Africa (owner decision
      2026-10-04). Source of truth is the api-gateway seed; the live API
      body is https://api.nyuchi.com/v1/ai/guardrails/standard and the
      canonical URL is bundu.org. The vocab.bundu.org guardrail terms are
      promoted from testing to stable with this publication. BAGS-08 (prompt injection) withholds its
      prompt guidance from publication.
    rationale: >-
      One published, versioned rule set means every app, and every entity
      that layers its own rules on top, starts from the same floor.

