      version 2.2. There is no later release.
    governs: >-
      The unit of every measured value (Cel, hPa, m/s, mm, %), so a number never
      travels without a machine-readable unit and a provider's own unit (knots,
      km/h) never reaches storage.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://ucum.org/ucum
    notes: >-
      CF Conventions accepts UCUM-form units, which is how the two fit together.
      Licence (read 2026-11-11, ucum.org/license): the UCUM Copyright Notice and
      License, Version 1.1 (June 2024), of Regenstrief Institute, Inc. (copyright
      1999-2024), carried in the repository as LICENSE.md. It is neither an
      open-source nor a Creative Commons licence. It grants a worldwide,
      non-exclusive, no-charge, royalty-free, revocable licence to reproduce,
      display and distribute the Work and to use it to develop and commercialise
      software that interoperates with it. It bars adding to, deleting from or
