      How station and observation data is served to other systems: Things,
      Datastreams, Observations, ObservedProperties, with the same model as SOSA.
    status: proposed
    decided: Owner direction 2026-10-29, adopt global standards and convert at the edge; listing proposed
    url: https://www.ogc.org/standards/sensorthings/
