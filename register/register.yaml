      2026 audit listed UCUM among the standards in use and not registered
      (nyuchi/data-infra#94, #179); it had been adopted on 2026-10-30, so it
      needed no new entry.
  - id: sosa_ssn
    name: Semantic Sensor Network ontology (SOSA/SSN)
    domain: weather
    category: vocabulary
    steward: W3C and OGC
    commitment: Observations are modelled as SOSA observations
    current: W3C Recommendation, 19 October 2017
    governs: >-
      The shape of an observation: what was observed (observed property), the
      feature of interest, the sensor or station that made it, the result and its
      phenomenon and result times.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://www.w3.org/TR/vocab-ssn/
  - id: ogc_sensorthings
    name: OGC SensorThings API
    domain: weather
    category: protocol
    steward: Open Geospatial Consortium
    commitment: The standard API for stations, datastreams and observations
    current: Part 1 Sensing 1.1 (OGC 18-088); Part 2 Tasking Core 1.0 (OGC 17-079r1)
    governs: >-
      How station and observation data is served to other systems: Things,
      Datastreams, Observations, ObservedProperties, with the same model as SOSA.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://www.ogc.org/standards/sensorthings/
  - id: wmdr
    name: WIGOS Metadata Standard (WMDR)
    domain: weather
    category: specification
    steward: World Meteorological Organization
    commitment: Station metadata follows WMDR, identified by WIGOS station identifier
    current: WMO-No. 1192, 2019 edition; code tables maintained in wmo-im/wmds
    governs: >-
      What is recorded about an observing station: its identifier, location,
      elevation, sensor heights, instruments and the programme it reports under.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://library.wmo.int/records/item/55626-wigos-metadata-standard
    docs: https://github.com/wmo-im/wmds
  - id: wis2
    name: WMO Information System 2.0 (WIS2)
    domain: weather
    category: protocol
    steward: World Meteorological Organization
    commitment: National met-service observations are read and published through WIS2 and its OGC API
    current: Manual on WIS, Volume II (WIS2 technical regulations); Guide to WIS, Volume II (WMO-No. 1061)
    governs: >-
      The global exchange of weather observations and forecasts: topics, metadata
      records and the OGC API Features endpoints (the Zimbabwe Meteorological
      Services Department node is one).
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://community.wmo.int/site/knowledge-hub/programmes-and-initiatives/wmo-information-system-wis
    docs: https://wmo-im.github.io/wis2-guide/
  - id: ogc_api_features
    name: OGC API - Features
    domain: core
    category: protocol
    steward: Open Geospatial Consortium (ISO 19168-1)
    commitment: Feature collections are served and read as OGC API Features
    current: Part 1 Core corrigendum 1.0.1 (ISO 19168-1:2020); Part 2 CRS by Reference 1.0; Part 3 Filtering
    governs: >-
      The API shape of a collection of geographic features (items, paging,
      filtering), which WIS2 nodes use.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://ogcapi.ogc.org/features/
  - id: ogc_api_tiles
    name: OGC API - Tiles
    domain: places
    category: protocol
    steward: Open Geospatial Consortium
    commitment: Tile sets (the base map, weather and places layers) are served and read as OGC API Tiles
    current: Part 1 Core, version 1.0, OGC 20-057, OGC Implementation Standard (read at source 2026-11-03)
    governs: >-
      The API shape of tiled map data: the landing page, the list of tilesets, a
      tile by tile matrix, and the conformance classes a server declares. The
      successor to WMTS.
    status: adopted
    decided: >-
      Owner decision 2026-11-04, adopt the five map-tile standards (proposed
      2026-11-03: Nyuchi Maps is a self-hosted map platform and the OGC API - Tiles
      guide was supplied as important), nyuchi/maps#4
    url: https://www.ogc.org/standards/ogcapi-tiles/
    docs: https://docs.ogc.org/is/20-057/20-057.html
    notes: >-
      Names tile matrix sets by reference to ogc_tms. The format of a tile is
      separate (mvt for vector tiles). Scope: the tile contract of Nyuchi Maps
      (nyuchi/maps#4). The weather Worker's /v1/map-tiles raster proxy and the
      MapTiler base map the apps use today predate it and are not covered by
      this entry.
  - id: ogc_api_common
    name: OGC API - Common, Part 1 Core
    domain: places
    category: specification
    steward: Open Geospatial Consortium
    commitment: >-
      The shared building blocks of an OGC API (landing page, conformance, links,
      OpenAPI definition) follow OGC API - Common
    current: >-
      Part 1 Core, version 1.0, OGC 19-072 (read at the OGC standard page
      2026-11-04, which gives the number and version and not the status; the
      Approved status is from the Nyuchi Maps tile contract, nyuchi/maps#5)
    governs: >-
      The landing page, the conformance declaration and the rules for links that
      every OGC API shares. OGC API - Tiles (ogc_api_tiles) builds on it: its
      tileset list and tileset resources depend on classes defined here.
    status: adopted
    decided: >-
      Found 2026-11-04 in the Nyuchi Maps tile contract (nyuchi/maps#5): OGC API -
      Tiles depends on it, and the owner adopted OGC API - Tiles the same day;
      listed as proposed because the owner adopted five named standards, not this
      one; adoption awaits the owner.
      Adopted 2026-11-11 on the owner's instruction in the coordinator's chat ("all the proposed
      standards please release them, into a beta. if they are ones we are adopting then we fully adopt
      everything now", then "we fully adopt").
    url: https://www.ogc.org/standards/ogcapi-common/
    docs: https://docs.ogc.org/is/19-072/19-072.html
    notes: >-
      Listed so the standards ogc_api_tiles needs are all in the register. Nothing
      is built on it that ogc_api_tiles does not already require.
  - id: ogc_tms
    name: OGC Two Dimensional Tile Matrix Set and Tile Set Metadata
    domain: places
    category: specification
    steward: Open Geospatial Consortium
    commitment: How a tiled map divides the world, and how a tile set is described, follow the OGC Tile Matrix Set standard
    current: >-
      Version 2.0, OGC 17-083r4, OGC Standard, status Approved (read at source
      2026-11-03; the approval and publication dates are not stated here)
    governs: >-
      The tile matrix sets (WebMercatorQuad and WorldCRS84Quad among them) that
      say what zoom, row and column mean, and the metadata that describes a tile set.
    status: adopted
    decided: >-
      Owner decision 2026-11-04, adopt the five map-tile standards (proposed
      2026-11-03: Nyuchi Maps is a self-hosted map platform and the OGC API - Tiles
      guide was supplied as important), nyuchi/maps#4
    url: https://docs.ogc.org/is/17-083r4/17-083r4.html
  - id: mvt
    name: Mapbox Vector Tile specification
    domain: places
    category: data_format
    steward: Mapbox (published openly, no standards body)
    commitment: Vector tiles are encoded as Mapbox Vector Tiles
    current: Version 2.1; the specification text is CC BY 3.0 US (read at source 2026-11-03)
    governs: >-
      The encoding of one vector tile: its layers, features, attributes and
      geometry commands.
    status: adopted
    decided: >-
      Owner decision 2026-11-04, adopt the five map-tile standards (proposed
      2026-11-03: Nyuchi Maps is a self-hosted map platform and the OGC API - Tiles
      guide was supplied as important), nyuchi/maps#4
    url: https://github.com/mapbox/vector-tile-spec
    notes: Not a standards-body specification. It is the format MapLibre, Planetiler and OGC API Tiles clients use for vector tiles.
  - id: tilejson
    name: TileJSON
    domain: places
    category: data_format
    steward: Mapbox (published openly, no standards body)
    commitment: A tile set a style refers to is described by a TileJSON document
    current: Version 3.0.0; the specification text is CC BY 3.0 US (read at source 2026-11-03)
    governs: >-
      A small JSON document that describes a tile set: where its tiles are, its
      zoom range and its bounds.
    status: adopted
    decided: >-
      Owner decision 2026-11-04, adopt the five map-tile standards (proposed
      2026-11-03: Nyuchi Maps is a self-hosted map platform and the OGC API - Tiles
      guide was supplied as important), nyuchi/maps#4
    url: https://github.com/mapbox/tilejson-spec
    notes: >-
      Not a standards-body specification. It sits beside OGC API Tiles for clients
      (MapLibre) that read a style and not an OGC landing page. OGC API - Tiles
      (ogc_api_tiles) is the canonical description of a tile set: a TileJSON
      document is derived from it and never states a bound, zoom range or tile
      URL that the OGC tileset metadata does not.
  - id: pmtiles
    name: PMTiles
    domain: places
    category: data_format
    steward: Protomaps LLC (published openly, no standards body)
    commitment: Map tiles are stored as PMTiles archives
    current: >-
      Version 3; the repository is BSD 3-Clause and the specification text states
      no licence of its own (read at source 2026-11-03)
    governs: >-
      A single-file archive of map tiles (a 127-byte header, directories, JSON
      metadata and the tile data) that is read by byte offsets and lengths, so a
      tile set can be served from plain storage.
    status: adopted
    decided: >-
      Owner decision 2026-11-04, adopt the five map-tile standards (proposed
      2026-11-03: Nyuchi Maps is a self-hosted map platform and the OGC API - Tiles
      guide was supplied as important), nyuchi/maps#4
    url: https://github.com/protomaps/PMTiles/blob/main/spec/v3/spec.md
    notes: Not a standards-body specification. A storage format, not an API; the API a client sees is ogc_api_tiles or tilejson.
  - id: sdmx
    name: Statistical Data and Metadata eXchange (SDMX)
    domain: open-data
    category: data_format
    steward: SDMX sponsors (BIS, ECB, Eurostat, IMF, OECD, UN, World Bank)
    commitment: Statistical series (production, yield, prices, food security) are modelled and exchanged as SDMX
    current: SDMX 3.1 Technical Specifications (May 2025); ISO 17369
    governs: >-
      Time series of statistics with dimensions, attributes and codelists, instead
      of a provider's own table layout.
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://sdmx.org/standards/
    notes: ISO 17369. Agricultural statistics published by FAO and others are available as SDMX.
  - id: ocha_cod
    name: OCHA Common Operational Datasets (COD) and P-codes
    domain: places
    category: identifier_scheme
    steward: UN OCHA
    commitment: Administrative areas carry their COD P-code as a cross-reference
    current: COD-AB administrative boundaries, latest version per country on HDX
    governs: >-
      The place codes for administrative boundaries used by humanitarian and
      national agencies (for example ZW10 to ZW19 for Zimbabwe's provinces).
    status: adopted
    decided: "Owner decision 2026-10-30, adopt global standards and convert at the edge"
    url: https://data.humdata.org/dataset/cod-ab-global
    docs: https://knowledge.base.unocha.org/wiki/spaces/imtoolbox/pages/2557378679
