    name: NIST SP 800-63-4 Digital Identity Guidelines
    domain: identity
    category: specification
    steward: NIST
    commitment: SP 800-63-4 (63A-4 identity proofing as the assurance mapping; 63B-4 AAL for authenticators)
    current: SP 800-63-4 Final (2025-07-31)
    governs: >-
      The reference mapping for verification assurance. The platform's own
      levels (0 none, 1 otp, 2 documented, 3 government, 4 licensed) map to
      IAL as follows: 2 documented to IAL1, 3 government and 4 licensed to
      IAL2. Levels 0 and 1 sit below IAL1. Attestations (community,
      business, representative, domain) are platform terms with no IAL. The
      mapping is a reference: the platform does not claim certified IAL
      conformance.
    status: adopted
    decided: OD 2026-10-03 (mukoko-dev/nyuchi-identity#23, decision D3)
    evidence:
