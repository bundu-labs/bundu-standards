    url: https://www.six-group.com/en/products-services/financial-information/data-standards.html
  - id: iso_639
    name: ISO 639
    domain: core
    category: identifier_scheme
    steward: ISO (ISO 639 Maintenance Agency)
    commitment: ISO 639:2023; 639-3 codes for languages without a 639-1 code
