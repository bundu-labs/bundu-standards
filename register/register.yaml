      - entity.entities.additionalType
      - entity.entities.recognitionBasis
      - identity.persons.notificationPreferences
      - api-gateway gateway/routers/open_data.py (kAnonymity, maxReidentificationRisk)
    url: https://vocab.bundu.org
    docs: https://github.com/bundu-labs/bundu-standards
    notes: >-
      Served by the Fly app bundu-vocab (jnb) from bundu-labs/bundu-standards.
      Every term dereferences to JSON-LD, or HTML when asked for it. A term
      the platform emits under vocab.bundu.org must be in the live index.
    foundational: true
    rationale: Lets an entity keep a valid Schema.org @type while saying what it really is.
