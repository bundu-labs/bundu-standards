[package]
name = "bundu-standards-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "The file endpoint of standards.bundu.org, as a Rust Cloudflare Worker"
publish = false

# Its own package, not part of the vocab server's: it builds for wasm32 and has its own deps.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
