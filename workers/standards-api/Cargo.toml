[package]
name = "bundu-standards-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "standards.bundu.org: its pages and its file endpoint, as a small native Rust server"
publish = false

[lib]
name = "bundu_standards_api"
path = "src/lib.rs"

[[bin]]
name = "bundu-standards"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Mzizi Roots: the pages are Dioxus components rendered on the server, with the Mzizi badge.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html"] }
dioxus-ssr = "0.7"
mzizi-ui = "0.7"
bundu-site = { path = "../../site" }
# The server: axum on tokio, and a small HTTPS client (rustls, no OpenSSL) for the file
# endpoint's reads of GitHub.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }

# build.rs turns register/register.yaml into JSON, so no YAML parser goes into the binary.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
# Renders our own standards' READMEs to HTML at build time, so no Markdown parser ships.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
pollster = "0.4"
