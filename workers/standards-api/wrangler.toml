# standards.bundu.org's file endpoint, in Rust (workers-rs). Issue #87.
#
# It has no route of its own: the Astro Worker (workers/standards) keeps standards.bundu.org and
# hands /register/latest and /<commit>/register/<file> to this Worker through the service binding
# STANDARDS_API. Until that binding exists, the Astro Worker answers with its own JS, so deploying
# this Worker changes nothing until the binding is added.
#
# No bindings and no secrets: it reads a public repository.
name = "bundu-standards-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "standards.bundu.org", custom_domain = true }]

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true
