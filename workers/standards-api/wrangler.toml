# standards.bundu.org in Rust (workers-rs): the pages and the file endpoint. Issue #87.
#
# The pages are rendered with Dioxus and Mzizi Roots from the register built into the Worker;
# the file endpoint reads a public repository. No bindings and no secrets.
#
# It serves standards.bundu.org: the custom domain moved here from the Astro Worker
# (workers/standards) on 2026-11-17. The route is declared here so every deploy keeps it.
name = "bundu-standards-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "standards.bundu.org", custom_domain = true }]

[build]
command = "cargo install -q worker-build && worker-build --release"

# The favicons, robots.txt and _headers, served before the Worker runs. Shared with the Astro
# Worker until it is retired, then moved here.
[assets]
directory = "../standards/public"

[observability]
enabled = true
